context:
  version: "0.3.1"
  python_min: '3.12'

package:
  name: jablonski
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jablonski/jablonski-${{ version }}.tar.gz
  sha256: 1a55ae19d4c34f6d375996305e26e870206067686eb854d30eb364e7aa6c6b85

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build
    - pip
  run:
    - python >=${{ python_min }}
    - poincare >=1.1.1

tests:
  - python:
      imports:
        - poincare
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://dyscolab.github.io
  documentation: https://dyscolab.github.io/jablonski
  repository: https://github.com/dyscolab/jablonski
  license: BSD-3-Clause
  license_file: LICENSE
  summary: 'Simulation of dynamical systems.'

extra:
  recipe-maintainers:
    - maurosilber
    - olistarosta
